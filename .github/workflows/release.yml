name: Build & Release

# 操作手册（与 Focus-Capture 同构）：
#   * push 到 main / dev（任何提交）→ 仅自动构建 development build：
#     多平台矩阵编译 + 单元测试，组装单包目录后作为 Actions artifact
#     （soundpad-development），**绝不创建 release / tag**。
#   * 发 release：Actions 页面 → Run workflow（workflow_dispatch），
#     可选 bump 档位（none/patch/minor/major，默认 none = 用 main 上
#     plugin.json 的当前版本）。流程：多平台构建 → 打包 → 打 tag v<ver> →
#     创建 Release（资产：plugin.zip 主包（固定名，不带版本号）+ plugin.json）。
#   * 同一版本重复发 release 会直接失败并提示（tag 已存在），防止误覆盖。
#   * 提交信息含 [skip ci] → 整个 workflow 跳过。

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      bump:
        description: "Release 版本档位：none = 使用 main 上 plugin.json 当前版本"
        type: choice
        default: none
        options: [none, patch, minor, major]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: 构建 ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: windows-x86_64-msvc, os: windows-latest, target: x86_64-pc-windows-msvc, artifact: soundpad.dll }
          - { label: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, artifact: soundpad.so,
              apt: "libasound2-dev pkg-config" }
          - { label: macos-aarch64, os: macos-latest, target: aarch64-apple-darwin, artifact: soundpad_aarch64.dylib }
          - { label: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin, artifact: soundpad_x86_64.dylib }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: 安装 Rust 工具链（stable + 目标平台）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2

      - name: 安装系统依赖 (Linux: ALSA headers for cpal)
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - name: 单元测试（宿主平台）
        run: cargo test --release

      - name: Release 构建
        run: cargo build --release --target ${{ matrix.target }}

      - name: 归一化产物名（去 lib 前缀，宿主按平台补后缀）
        shell: bash
        run: |
          mkdir -p stage
          case "${{ matrix.artifact }}" in
            *.dylib) cp target/${{ matrix.target }}/release/libsoundpad.dylib "stage/${{ matrix.artifact }}" ;;
            *.so)    cp target/${{ matrix.target }}/release/libsoundpad.so    "stage/${{ matrix.artifact }}" ;;
            *)       cp target/${{ matrix.target }}/release/soundpad.dll      "stage/${{ matrix.artifact }}" ;;
          esac
          ls -la stage/

      - name: 上传平台产物
        uses: actions/upload-artifact@v7
        with:
          name: lib-${{ matrix.label }}
          path: stage/${{ matrix.artifact }}

  package:
    name: 组装插件包（macOS universal + 单包目录）
    needs: [build]
    runs-on: macos-latest
    outputs:
      stage-ready: true
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      # GitHub 产物存储偶发瞬时故障（blob 下载重试耗尽），下载步骤自带重试语义有限，
      # 失败时重跑本 job 即可
      - name: 下载各平台产物
        uses: actions/download-artifact@v7
        with:
          pattern: lib-*
          path: libs
          merge-multiple: true

      - name: 扁平化产物（兼容 artifact 任意目录层级）
        run: |
          mkdir -p libs_flat
          find libs -type f | while read -r f; do cp "$f" "libs_flat/$(basename "$f")"; done
          ls -la libs_flat/
          test -f libs_flat/soundpad.dll
          test -f libs_flat/soundpad.so
          test -f libs_flat/soundpad_aarch64.dylib
          test -f libs_flat/soundpad_x86_64.dylib

      - name: 合成 macOS universal dylib（arm64 + x86_64）
        run: |
          lipo -create libs_flat/soundpad_aarch64.dylib libs_flat/soundpad_x86_64.dylib \
            -output libs_flat/soundpad.dylib
          lipo -info libs_flat/soundpad.dylib

      - name: 组装插件包目录（根即 plugin.json，可直接安装/导入）
        run: |
          mkdir -p stage
          cp plugin.json panel.html README.md LICENSE stage/
          cp libs_flat/soundpad.dll libs_flat/soundpad.so libs_flat/soundpad.dylib stage/
          ls -la stage/

      - name: 上传插件包 stage
        uses: actions/upload-artifact@v7
        with:
          name: soundpad-stage
          path: stage

  dev-package:
    name: development 包（仅 push）
    if: github.event_name == 'push'
    needs: [package]
    runs-on: ubuntu-latest
    steps:
      - name: 下载插件包 stage
        uses: actions/download-artifact@v7
        with:
          name: soundpad-stage
          path: stage

      # artifact zip 的根即包内容（upload-artifact 会剥离公共父目录），
      # 用户下载该 artifact 后无需解套、直接解压安装或应用内导入
      - name: 上传 development artifact
        uses: actions/upload-artifact@v7
        with:
          name: soundpad-development
          path: stage

  release:
    name: 手动发布 Release
    if: github.event_name == 'workflow_dispatch'
    needs: [package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: 下载插件包 stage
        uses: actions/download-artifact@v7
        with:
          name: soundpad-stage
          path: stage

      - name: 决定版本号（bump 档位 / 防重复）
        id: ver
        run: |
          python3 - <<'PY'
          import json, os
          p = 'plugin.json'
          m = json.load(open(p))
          maj, min_, pat = [int(x) for x in m['version'].split('.')[:3]]
          bump = os.environ['BUMP']
          if bump == 'patch':
              pat += 1
          elif bump == 'minor':
              min_ += 1; pat = 0
          elif bump == 'major':
              maj += 1; min_ = 0; pat = 0
          ver = f"{maj}.{min_}.{pat}"
          m['version'] = ver
          json.dump(m, open(p, 'w'), ensure_ascii=False, indent=2)
          open(os.environ['GITHUB_OUTPUT'], 'a').write(f"version={ver}\n")
          open(os.environ['GITHUB_OUTPUT'], 'a').write(f"bumped={'true' if bump != 'none' else 'false'}\n")
          print("release version:", ver, f"(bump={bump})")
          PY
        env:
          BUMP: ${{ github.event.inputs.bump }}

      - name: 防止重复发布同版本
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::release v${{ steps.ver.outputs.version }} 已存在；请在 main 修改 plugin.json 版本或选择 bump 档位"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 组装发布包（plugin.json 全通道同一份，downloadUrl 固定指向 latest）
        run: |
          VER="${{ steps.ver.outputs.version }}"
          python3 - "$VER" <<'PY'
          import json, sys
          ver = sys.argv[1]
          expect = "https://github.com/OrientCOMPASS/MicYouSoundpad-plugin/releases/latest/download/plugin.zip"
          m = json.load(open('plugin.json'))
          assert m['version'] == ver, f"manifest version {m['version']} != {ver}"
          assert m.get('downloadUrl') == expect, \
              f"plugin.json 的 downloadUrl 应为 {expect}，实际为 {m.get('downloadUrl')!r}"
          PY
          mkdir -p dist
          # stage/ 里的 plugin.json 来自打包时的 checkout；若 bump 过版本，用回写后的替换
          cp plugin.json stage/plugin.json
          (cd stage && zip -q -r ../dist/plugin.zip .)
          ls -la dist/

      - name: 生成变更日志（自上一个 tag）
        run: |
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST" ]; then git log --oneline "$LAST..HEAD" > /tmp/notes.md; else git log --oneline -20 > /tmp/notes.md; fi
          echo "" >> /tmp/notes.md
          echo "多平台单包：windows x86_64 / linux x86_64 / macOS universal (arm64+x86_64)。主包固定名 plugin.zip（不带版本号），更新/下载统一走 releases/latest/download/plugin.zip。release 的 plugin.json 资产可直接用于向 MicYou-Plugins 提手动市场 PR。" >> /tmp/notes.md

      - name: 打 tag 并发布 Release
        run: |
          VER="${{ steps.ver.outputs.version }}"
          git config user.name "OrientCOMPASS"
          git config user.email "316423573+OrientCOMPASS@users.noreply.github.com"
          git tag "v${VER}"
          git push origin "v${VER}"
          gh release create "v${VER}" dist/plugin.zip plugin.json \
            --title "v${VER}" --notes-file /tmp/notes.md
        env:
          GH_TOKEN: ${{ github.token }}

      - name: bump 回提交到 main（[skip ci]）
        if: steps.ver.outputs.bumped == 'true'
        run: |
          git add plugin.json
          git commit -m "chore(release): bump version to ${{ steps.ver.outputs.version }} [skip ci]"
          git push origin HEAD:main
        env:
          GH_TOKEN: ${{ github.token }}
