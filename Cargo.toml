[package]
name = "soundpad"
version = "1.0.0"
edition = "2021"
license = "Unlicense"
description = "MicYou native DSP plugin: phone-controlled soundpad — plays WAV/MP3/FLAC/OGG/M4A sounds with per-session volume/seek/loop and multi-voice mixing into the mic stream"
publish = false

# Standalone crate: build on demand with `cargo build --release`
# (not part of any workspace, mirrors an external plugin author's setup)
[workspace]

[lib]
name = "soundpad"
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
# 本地耳机输出（"播放到耳机"，独立于宿主监听）：跨平台音频输出
# （Windows WASAPI / macOS CoreAudio / Linux ALSA）。
cpal = "0.18"
# 纯 Rust 解码框架（无 C 依赖，四平台 CI 直接可编）：
# MP3 / FLAC / OGG Vorbis / AAC(M4A, ISO-MP4) + 容器探测。
# WAV 仍走自带的轻量解码器（src/wav.rs，头部探测更快、已充分测试）。
symphonia = { version = "0.5", default-features = false, features = [
  "mp3", "flac", "ogg", "vorbis", "aac", "isomp4",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# 绝不设置 panic = "abort"：本 cdylib 运行在宿主进程内，abort 会直接带走整个
# MicYou；保持 unwind 才能让 lib.rs 的 catch_unwind 把插件内部 panic 挡在
# FFI 边界内。
